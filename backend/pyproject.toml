[tool.poetry]
name = "itws-final-exam"
version = "0.1.0"
description = ""
authors = ["Ivan Kobets"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.136.1"
sqlalchemy = "^2.0.49"
alembic = "^1.18.4"
pydantic-settings = "^2.14.1"
asyncpg = "^0.31.0"
bcrypt = "^5.0.0"
psycopg = {extras = ["binary"], version = "^3.3.4"}
gunicorn = "^26.0.0"
uvicorn = {extras = ["standard"], version = "^0.47.0"}


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.15.13"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
src = ["core", "src", "tests"]
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "Q",   # flake8-quotes (inline vs docstring where applicable)
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific
    "D",   # pydocstyle (docstrings)
]
ignore = [
    "COM812", # trailing comma
    "D203",   # one-blank-line-before-class
    "D213",   # multi-line-summary-second-line
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"src/connectors/database/alembic/versions/*.py" = ["D"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
