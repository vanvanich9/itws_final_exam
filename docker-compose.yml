services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - '3000:3000'
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/svelte.config.js:/app/svelte.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
    environment:
      PUBLIC_API_URL: ''
      BACKEND_URL: http://backend:8000
      ORIGIN: http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - '8000:8000'
    volumes:
      - ./backend/core:/app/core
      - ./backend/src:/app/src
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: db
      SECRET_KEY: secret-key-for-dev-and-tests-long-enough-for-hs256
      DEBUG: 'true'
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      seed_db:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/ping\")" || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  init_db:
    build:
      context: ./backend
      target: dev
    entrypoint:
      - poetry
      - run
      - alembic
      - -c
      - src/connectors/database/alembic.ini
      - upgrade
      - head
    volumes:
      - ./backend/core:/app/core
      - ./backend/src:/app/src
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: db
      SECRET_KEY: secret-key-for-dev-and-tests-long-enough-for-hs256
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed_db:
    image: postgres:17
    entrypoint: ['/bin/sh', '/seed_db.sh']
    volumes:
      - ./seed_db.sh:/seed_db.sh:ro
      - ./db_dump.sql:/db_dump.sql:ro
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: db
    depends_on:
      init_db:
        condition: service_completed_successfully
    restart: 'no'

  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
