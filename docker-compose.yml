services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - '8000:8000'
    volumes:
      - ./backend/core:/app/core
      - ./backend/src:/app/src
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: db
      SECRET_KEY: secret-key-for-dev-and-tests-long-enough-for-hs256
    depends_on:
      init_db:
        condition: service_completed_successfully

  init_db:
    build:
      context: ./backend
      target: dev
    entrypoint:
      - poetry
      - run
      - alembic
      - -c
      - src/connectors/database/alembic.ini
      - upgrade
      - head
    volumes:
      - ./backend/core:/app/core
      - ./backend/src:/app/src
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: db
      SECRET_KEY: secret-key-for-dev-and-tests-long-enough-for-hs256
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
